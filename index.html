<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Premium Search</title>
  <meta name="description" content="Search YouTube with advanced filters — sort by relevance, views, date, and engagement rate."/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

  <!-- Tailwind (for card injection in main.js) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* ─── Design Tokens ─────────────────────────────────────────── */
    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface-2:    #21262d;
      --border:       #30363d;
      --border-hover: #58a6ff;
      --accent:       #2f81f7;
      --accent-glow:  rgba(47, 129, 247, 0.15);
      --text:         #e6edf3;
      --text-muted:   #8b949e;
    }

    /* ─── Base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      /* Ambient gradient background */
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(47,129,247,0.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 80%, rgba(138,43,226,0.05), transparent);
      background-attachment: fixed;
    }

    /* ─── Sidebar ───────────────────────────────────────────────── */
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      height: 100%;
      width: 72px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 0;
      gap: 2rem;
      z-index: 40;
    }
    @media (min-width: 768px) { .sidebar { display: flex; } }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
      text-decoration: none;
    }
    .nav-item:hover { color: var(--text); }
    .nav-item.active { color: var(--accent); }
    .nav-item span.label {
      font-size: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* ─── Header ────────────────────────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 50;
    }
    @media (min-width: 768px) { .topbar { padding-left: calc(72px + 1.5rem); } }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      flex-shrink: 0;
    }
    .topbar-brand .logo-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .topbar-brand h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      white-space: nowrap;
    }

    /* ─── Search bar ────────────────────────────────────────────── */
    .search-wrap {
      flex: 1;
      max-width: 560px;
      margin: 0 1.5rem;
      display: none;
    }
    @media (min-width: 640px) { .search-wrap { display: block; } }

    .search-inner {
      position: relative;
      width: 100%;
    }
    .search-inner input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.55rem 2.75rem 0.55rem 1.1rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-inner input::placeholder { color: var(--text-muted); }
    .search-inner input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-inner button {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .search-inner button:hover { color: var(--text); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      padding: 0.4rem;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid var(--border);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ─── Main Layout ───────────────────────────────────────────── */
    .main-wrap {
      padding-top: 80px;
      padding-bottom: 2rem;
      padding-left: 1rem;
      padding-right: 1rem;
      max-width: 1480px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .main-wrap {
        padding-left: calc(72px + 1.5rem);
        padding-right: 1.5rem;
      }
    }

    /* ─── Filter Bar ────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.75rem;
      animation: fadeInDown 0.4s ease both;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }
    .filter-group label {
      font-size: 0.7rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .filter-group label.accent { color: var(--accent); }

    .filter-group input[type="month"],
    .filter-group select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: auto;
    }
    .filter-group input[type="month"]:focus,
    .filter-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .filter-group select.accent-select {
      border-color: rgba(47, 129, 247, 0.4);
    }
    select option { background-color: var(--surface); }

    /* Mobile search bar under header */
    .mobile-search {
      display: block;
      margin-bottom: 1.25rem;
    }
    @media (min-width: 640px) { .mobile-search { display: none; } }

    /* ─── Error & Loader ────────────────────────────────────────── */
    #error-message {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgb(239, 68, 68);
      color: #fca5a5;
      padding: 0.875rem 1.25rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    #error-message.hidden { display: none; }

    .loader {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 3rem auto;
    }
    .loader.hidden { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Results Grid ──────────────────────────────────────────── */
    #results-grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: 1fr;
      animation: fadeIn 0.3s ease;
    }
    @media (min-width: 480px)  { #results-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px)  { #results-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1200px) { #results-grid { grid-template-columns: repeat(4, 1fr); } }

    /* ─── Load More ─────────────────────────────────────────────── */
    #load-more-container {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
    }
    #load-more-container.hidden { display: none; }

    #load-more-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.65rem 2.25rem;
      border-radius: 100px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    #load-more-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
      transform: translateY(-1px);
    }
    #load-more-btn:active { transform: translateY(0); }
    #load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ─── Animations ────────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Material Icons fix ────────────────────────────────────── */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }

    /* ─── Scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ─── Empty State ───────────────────────────────────────────── */
    .empty-state {
      grid-column: 1/-1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 5rem 1rem;
      color: var(--text-muted);
      text-align: center;
    }
    .empty-state .material-symbols-outlined { font-size: 3rem; opacity: 0.4; }
    .empty-state p { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; }
  </style>
</head>

<body>

<!-- ── Sidebar Navigation ───────────────────────────────────────── -->
<aside class="sidebar">
  <div class="nav-item active" style="margin-bottom: 0.5rem;">
    <div style="width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px var(--accent-glow);">
      <span class="material-symbols-outlined" style="color:white;font-size:20px;">smart_display</span>
    </div>
  </div>
  <a class="nav-item active" href="#">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">home</span>
    <span class="label">Home</span>
  </a>
  <a class="nav-item" href="#">
    <span class="material-symbols-outlined">explore</span>
    <span class="label">Explore</span>
  </a>
  <a class="nav-item" href="#">
    <span class="material-symbols-outlined">subscriptions</span>
    <span class="label">Subs</span>
  </a>
  <a class="nav-item" href="#">
    <span class="material-symbols-outlined">video_library</span>
    <span class="label">Library</span>
  </a>
  <a class="nav-item" href="#" style="margin-top:auto;">
    <span class="material-symbols-outlined">settings</span>
    <span class="label">Settings</span>
  </a>
</aside>

<!-- ── Top Bar ──────────────────────────────────────────────────── -->
<header class="topbar">
  <!-- Brand -->
  <div class="topbar-brand">
    <button class="icon-btn" style="display:flex;margin-right:0.25rem;" id="menu-btn" aria-label="Menu">
      <span class="material-symbols-outlined" style="font-size:22px;">menu</span>
    </button>
    <div class="logo-icon">
      <span class="material-symbols-outlined" style="color:white;font-size:18px;">smart_display</span>
    </div>
    <h1>Premium Search</h1>
  </div>

  <!-- Desktop Search -->
  <div class="search-wrap">
    <form id="search-form" class="search-inner">
      <input
        id="search-query"
        type="text"
        placeholder="Search YouTube content…"
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit" aria-label="Search">
        <span class="material-symbols-outlined" style="font-size:20px;">search</span>
      </button>
    </form>
  </div>

  <!-- Right Actions -->
  <div class="topbar-right">
    <button class="icon-btn" id="mobile-search-btn" aria-label="Search" style="display:flex;">
      <span class="material-symbols-outlined" style="font-size:22px;">search</span>
    </button>
    <div class="avatar">
      <img src="https://ui-avatars.com/api/?name=Biz+Growth&background=2F81F7&color=fff" alt="User profile"/>
    </div>
  </div>
</header>

<!-- ── Main Content ──────────────────────────────────────────────── -->
<main class="main-wrap">

  <!-- Mobile Search -->
  <div class="mobile-search">
    <form id="search-form-mobile" class="search-inner">
      <input
        id="search-query-mobile"
        type="text"
        placeholder="Search YouTube content…"
        autocomplete="off"
      />
      <button type="submit" aria-label="Search">
        <span class="material-symbols-outlined" style="font-size:20px;">search</span>
      </button>
    </form>
  </div>

  <!-- Filter Bar -->
  <section class="filter-bar" aria-label="Search filters">
    <div class="filter-group">
      <label for="month-year">Published After</label>
      <input type="month" id="month-year"/>
    </div>
    <div class="filter-group">
      <label for="primary-sort">Primary Sort</label>
      <select id="primary-sort">
        <option value="relevance">Relevance</option>
        <option value="date">Upload Date</option>
        <option value="rating">Highest Rating</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="secondary-sort" class="accent">Secondary Rank</label>
      <select id="secondary-sort" class="accent-select">
        <option value="none">None</option>
        <option value="mostViewed">Most Viewed</option>
        <option value="newest">Newest First</option>
        <option value="highestEngagement">Highest Engagement</option>
      </select>
    </div>
  </section>

  <!-- Error -->
  <div id="error-message" class="hidden" role="alert"></div>

  <!-- Loader -->
  <div id="loader" class="loader hidden" aria-label="Loading…"></div>

  <!-- Results -->
  <div id="results-grid" role="list" aria-live="polite">
    <!-- Default empty state -->
    <div class="empty-state">
      <span class="material-symbols-outlined">video_search</span>
      <p>Search for YouTube videos to get started</p>
    </div>
  </div>

  <!-- Load More -->
  <div id="load-more-container" class="hidden">
    <button id="load-more-btn">Load More</button>
  </div>

</main>

<script>
  // Sync mobile search form with desktop IDs expected by main.js
  const mobileForm  = document.getElementById('search-form-mobile');
  const mobileInput = document.getElementById('search-query-mobile');
  const desktopInput = document.getElementById('search-query');
  const desktopForm  = document.getElementById('search-form');

  if (mobileForm) {
    mobileForm.addEventListener('submit', e => {
      e.preventDefault();
      desktopInput.value = mobileInput.value;
      desktopForm.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    });
  }

  // Clear empty state on first result injection
  const resultsGrid = document.getElementById('results-grid');
  const observer = new MutationObserver(() => {
    const emptyState = resultsGrid.querySelector('.empty-state');
    if (emptyState && resultsGrid.children.length > 1) emptyState.remove();
  });
  observer.observe(resultsGrid, { childList: true });
</script>

<script type="module" src="/main.js"></script>
</body>
</html>
